name: Check for broken links

on:
  push:
    branches: [main]
    paths: ["_pages/**", "_news/**", ".github/workflows/broken-links.yml"]
  pull_request:
    branches: [main]
    paths: ["_pages/**", "_news/**", ".github/workflows/broken-links.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check content links
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          # 404.md contains a Liquid URL; rendered local links are checked in Deploy site.
          args: --exclude-path _pages/404.md --max-retries 3 --verbose --no-progress '_pages/**/*.md' '_news/**/*.md'
